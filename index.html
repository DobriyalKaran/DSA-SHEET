<html lang="en"><head><meta charset="UTF-8">

<title>DSA Master Sheet</title>
<style>
:root{--bg:#0f1115;--card:#161922;--line:#242835;--ink:#e6e9ef;--mut:#9aa3b2;--dim:#646c7d;
--teal:#45c8bf;--easy:#5cc98a;--med:#e0a34a;--hard:#e0687a;

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;

a{color:inherit;text-decoration:none;}
.wrap{max-width:780px;margin:0 auto;padding:0 18px 100px;}

header{padding:34px 0 10px;}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;}
.meta{color:var(--mut);font-size:13.5px;margin-top:4px;}
.pbar{height:5px;background:var(--line);border-radius:99px;margin-top:16px;overflow:hidden;}
.pbar i{display:block;height:100%;width:0;background:var(--teal);transition:width .35s;}
.pinfo{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:7px;font-family:var(--mono);}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;margin-top:6px;
display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{background:transparent;color:var(--mut);border:0;padding:6px 11px;font-size:12.5px;
font-family:var(--sans);cursor:pointer;}
.seg button.on{background:var(--teal);color:#08110f;font-weight:600;}
.grow{flex:1;}
.rst{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;
padding:6px 10px;font-size:12px;cursor:pointer;}
.rst:hover{color:var(--hard);border-color:var(--hard);}

.pat{margin-top:22px;}
.ph{display:flex;align-items:baseline;gap:10px;cursor:pointer;padding:6px 0;}
.pn{font-family:var(--mono);font-size:13px;color:var(--dim);flex:none;width:22px;}
.pt{font-size:16.5px;font-weight:650;}
.pc{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--mut);flex:none;}
.soch{color:var(--mut);font-size:13px;margin:0 0 8px 32px;}
.pat.closed .soch,.pat.closed ul{display:none;}
.caret{color:var(--dim);font-size:12px;transition:.15s;}
.pat.closed .caret{transform:rotate(-90deg);display:inline-block;}

ul{list-style:none;margin:0 0 4px;padding:0;}
li{display:flex;align-items:center;gap:12px;padding:9px 8px 9px 10px;border-radius:8px;}
li:hover{background:var(--card);}
li.done .nm{color:var(--dim);text-decoration:line-through;}
.cb{flex:none;width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;
background:transparent;cursor:pointer;display:grid;place-items:center;}
.cb:hover{border-color:var(--teal);}
li.done .cb{background:var(--teal);border-color:var(--teal);}
.cb svg{opacity:0;}li.done .cb svg{opacity:1;}
.nm{flex:1;font-size:14px;min-width:0;}.nm a:hover{color:var(--teal);}
.no{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px;}
.d{flex:none;font-family:var(--mono);font-size:11px;font-weight:600;min-width:58px;text-align:right;}
.d.Easy{color:var(--easy);}.d.Medium{color:var(--med);}.d.Hard{color:var(--hard);}
.hidden{display:none !important;}
footer{color:var(--dim);font-size:12px;margin-top:34px;font-family:var(--mono);text-align:center;}
.srs{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--dim);min-width:46px;text-align:right;}
.srs.due{color:var(--med);font-weight:600;}
.rev{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
background:linear-gradient(180deg,rgba(69,200,191,.06),transparent);}
.revhd{display:flex;align-items:center;gap:10px;}
.revt{font-size:14.5px;font-weight:650;}
.revc{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--teal);}
.revempty{color:var(--mut);font-size:13px;margin:8px 0 2px;}
.revrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);margin-top:8px;}
.rvnm{flex:1;min-width:0;font-size:13.5px;}
.rvnm a:hover{color:var(--teal);}
.rvmeta{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;font-family:var(--mono);}
.late{color:var(--hard);}.ontime{color:var(--med);}
.rvbtns{flex:none;display:flex;gap:6px;}
.rvbtns button{border:1px solid var(--line);background:transparent;border-radius:7px;
padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:var(--sans);}
.rvbtns .ok{color:var(--easy);}.rvbtns .ok:hover{border-color:var(--easy);}
.rvbtns .no2{color:var(--mut);}.rvbtns .no2:hover{border-color:var(--hard);color:var(--hard);}
@media(max-width:520px){.no{display:none;}.revrow{flex-wrap:wrap;}.rvbtns{width:100%;}.rvbtns button{flex:1;}}
.tier{padding:14px 8px 5px;display:flex;align-items:center;gap:9px;pointer-events:none;}
li.tier:hover{background:transparent;}
.tier .tl{font-size:12.5px;font-weight:700;flex:none;letter-spacing:.01em;}
.tier .ts{font-size:11.5px;color:var(--dim);flex:none;}
.tier .ln{flex:1;height:1px;background:var(--line);margin-left:2px;}
.tier.e .tl{color:var(--easy);}.tier.m .tl{color:var(--med);}.tier.h .tl{color:var(--hard);}
@media(max-width:520px){.tier .ts{display:none;}}

const TOTAL=534,NPAT=24,KEY="dsa_master_sheet_v1",SKEY="dsa_master_srs_v1";
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){}
let srs={};try{srs=JSON.parse(localStorage.getItem(SKEY)||"{}");}catch(e){}
let ff="all",df="all";
const META=[];DATA.forEach(p=>p.q.forEach(q=>META.push({uid:q.uid,n:q.n,t:q.t,d:q.d,u:q.u,pat:p.name})));
const IV=[1,3,7,16,35,90];
const TIER={Easy:["e","🌱 Warm-up","yahin se start — momentum banao"],
Medium:["m","🔥 Stretch zone","asli khel — thoda push karo"],
Hard:["h","💪 Boss level","yeh crack toh interview-ready"]};
function tierHTML(diff){const t=TIER[diff];if(!t)return"";return '<li class="tier '+t[0]+'" data-d="'+diff+'"><span class="tl">'+t[1]+'</span><span class="ts">'+t[2]+'</span><span class="ln"></span></li>';}
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function iso(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x;}
function parseISO(s){const a=s.split("-").map(Number);const d=new Date(a[0],a[1]-1,a[2]);d.setHours(0,0,0,0);return d;}
function daysToDue(u){return Math.round((parseISO(srs[u].due)-today())/86400000);}
function schedule(u,box){box=Math.max(1,Math.min(box,6));srs[u]={box:box,due:iso(addDays(today(),IV[box-1])),last:iso(today())};}
function isDue(u){return !!(done[u]&&srs[u]&&parseISO(srs[u].due)<=today());}
function saveSrs(){localStorage.setItem(SKEY,JSON.stringify(srs));}
(function backfill(){let i=0,ch=false;Object.keys(done).forEach(u=>{if(!srs[u]){srs[u]={box:1,due:iso(addDays(today(),i%5)),last:iso(today())};i++;ch=true;}});if(ch)saveSrs();})();
const $=s=>document.querySelector(s);
const tk='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#08110f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
function save(){localStorage.setItem(KEY,JSON.stringify(done));}
function build(){
 const m=$("#main");m.innerHTML="";
 DATA.forEach(p=>{
  const sec=document.createElement("section");sec.className="pat";sec.dataset.id=p.id;
  const seen={};
  const items=p.q.map(q=>{const d=!!done[q.uid];let hdr="";if(!seen[q.d]){seen[q.d]=1;hdr=tierHTML(q.d);}
   return hdr+`<li class="${d?'done':''}" data-uid="${q.uid}" data-d="${q.d}">
   <div class="cb" role="checkbox" aria-checked="${d}" tabindex="0">${tk}</div>
   <span class="nm"><a href="${q.u}" target="_blank" rel="noopener">${q.t}</a><span class="no">#${q.n}</span></span>
   <span class="srs"></span><span class="d ${q.d}">${q.d}</span></li>`;}).join("");
  sec.innerHTML=`<div class="ph"><span class="pn">${String(p.order).padStart(2,'0')}</span>
   <span class="pt">${p.name}</span><span class="pc"><span class="cnt">0</span>/${p.q.length}</span>
   <span class="caret">▾</span></div>
   <p class="soch">${p.soch}</p><ul>${items}</ul>`;
  m.appendChild(sec);
  sec.querySelector(".ph").addEventListener("click",()=>sec.classList.toggle("closed"));
  sec.querySelectorAll("li").forEach(li=>{const cb=li.querySelector(".cb");if(!cb)return;
   const t=()=>{const u=li.dataset.uid;if(done[u]){delete done[u];delete srs[u];}else{done[u]=1;schedule(u,1);}save();saveSrs();refresh();};
   cb.addEventListener("click",t);
   cb.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();t();}});});
 });
 refresh();
}
function refresh(){
 let total=0,mastered=0;
 DATA.forEach(p=>{const sec=document.querySelector(`.pat[data-id="${p.id}"]`);
  let c=0;p.q.forEach(q=>{if(done[q.uid])c++;});total+=c;if(c===p.q.length)mastered++;
  sec.querySelector(".cnt").textContent=c;
  sec.querySelectorAll("li").forEach(li=>{const u=li.dataset.uid;if(!u)return;const d=!!done[u];
   li.classList.toggle("done",d);li.querySelector(".cb").setAttribute("aria-checked",d);
   const chip=li.querySelector(".srs");if(chip){if(d&&srs[u]){const dd=daysToDue(u);if(dd<=0){chip.textContent="revise";chip.className="srs due";}else{chip.textContent="🔁 "+dd+"d";chip.className="srs";}}else{chip.textContent="";chip.className="srs";}}});
 });
 const pct=Math.round(total/TOTAL*100);
 $("#pf").style.width=pct+"%";
 $("#pl").textContent=total+" done · "+pct+"%";
 $("#pm").textContent=mastered+"/"+NPAT+" patterns";
 renderRev();
 applyF();
}
function applyF(){
 document.querySelectorAll("li").forEach(li=>{const d=!!done[li.dataset.uid];let s=true;
  if(ff==="todo"&&d)s=false;if(ff==="done"&&!d)s=false;if(ff==="revise"&&!isDue(li.dataset.uid))s=false;
  if(df!=="all"&&li.dataset.d!==df)s=false;li.classList.toggle("hidden",!s);});
 document.querySelectorAll(".pat").forEach(sec=>{
  const any=[...sec.querySelectorAll("li")].some(li=>!li.classList.contains("hidden"));
  sec.classList.toggle("hidden",!any);});
}
$("#ff").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 $("#ff").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");ff=b.dataset.f;applyF();});
$("#df").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 $("#df").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");df=b.dataset.d;applyF();});
let closed=false;
$("#tog").addEventListener("click",()=>{closed=!closed;
 document.querySelectorAll(".pat").forEach(s=>s.classList.toggle("closed",closed));
 $("#tog").textContent=closed?"Expand":"Collapse";});
$("#rst").addEventListener("click",()=>{if(confirm("Saara progress + revision schedule reset? Wapas nahi aayega.")){done={};srs={};save();saveSrs();refresh();}});
function renderRev(){
 const box=$("#rev");if(!box)return;
 const due=META.filter(q=>isDue(q.uid)).sort((a,b)=>parseISO(srs[a.uid].due)-parseISO(srs[b.uid].due));
 const pipe=Object.keys(srs).filter(u=>done[u]).length;
 if(!due.length){
  box.innerHTML='<div class="revhd"><span class="revt">🔁 Aaj ka revision</span><span class="revc">Sab clear ✓</span></div>'+
   '<p class="revempty">Aaj koi revision due nahi. '+pipe+' solved schedule pe hain — sahi din pe apne aap yahan aayenge.</p>';
  return;}
 let rows="";
 due.forEach(q=>{const dd=daysToDue(q.uid);
  const late=dd<0?'<span class="late">'+(-dd)+'d late</span>':'<span class="ontime">aaj due</span>';
  rows+='<div class="revrow"><span class="rvnm"><a href="'+q.u+'" target="_blank" rel="noopener">'+q.t+'</a>'+
   '<span class="rvmeta">'+q.pat+' · <b class="d '+q.d+'">'+q.d+'</b> · box '+srs[q.uid].box+'/6 · '+late+'</span></span>'+
   '<span class="rvbtns"><button class="ok" data-u="'+q.uid+'">Yaad tha \u2713</button>'+
   '<button class="no2" data-u="'+q.uid+'">Bhool gaya \u21ba</button></span></div>';});
 box.innerHTML='<div class="revhd"><span class="revt">🔁 Aaj ka revision</span><span class="revc">'+due.length+' due</span></div>'+rows;
 box.querySelectorAll(".ok").forEach(b=>b.addEventListener("click",()=>{const u=b.dataset.u;schedule(u,(srs[u].box||1)+1);saveSrs();refresh();}));
 box.querySelectorAll(".no2").forEach(b=>b.addEventListener("click",()=>{schedule(b.dataset.u,1);saveSrs();refresh();}));
}
build();
</script></body></html>
